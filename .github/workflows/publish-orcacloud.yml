name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  # Space-separated globs matching the plugin files to upload (.whl / .py).
  # orca_plugin_x1plus_any.py is the OS/arch-suffixed copy required by the
  # hub (pure Python + paramiko, so it's tagged "any" rather than a
  # platform-specific suffix) -- see README.md and CREDITS.md/context doc
  # §13 for why the repo keeps a plain-named dev copy separately.
  PLUGIN_FILES: "orca_plugin_x1plus_any.py"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build hub upload copy
        # orca_plugin_x1plus_any.py is gitignored (see .gitignore) since
        # it's byte-identical to the tracked orca_plugin_x1plus.py, just
        # renamed to satisfy the hub's required OS/arch filename suffix --
        # not worth tracking as a second copy, so it's generated here
        # instead of committed.
        run: cp orca_plugin_x1plus.py orca_plugin_x1plus_any.py

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          # --form-string, not -F: curl's -F splits its value on ";" to look
          # for type=/filename= modifiers, so a changelog containing a
          # literal semicolon corrupts the JSON (confirmed live: a release
          # description with one ';' in it produced a "must be valid JSON"
          # 400 from the API). --form-string sends the value with no such
          # parsing.
          args=(--form-string "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
